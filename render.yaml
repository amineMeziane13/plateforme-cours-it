services:
  - type: web
    name: it-courses-platform
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install --omit=dev
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
